name: Parameter Golf Manual Deep Audit

on:
  workflow_dispatch:
    inputs:
      candidate_dir:
        description: "Candidate folder to validate deeply"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  omar-deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Omar Gate deep audit
        id: omar
        uses: ./.github/actions/sentinelayer-v1-action
        with:
          sentinelayer_token: ${{ secrets.SENTINELAYER_TOKEN }}
          scan_mode: deep
          severity_gate: P2
          wait_timeout_seconds: 1800
          spec_binding_mode: auto_discovered
          model_training_intent: parameter-golf

      - name: Upload Omar artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omar-nightly-${{ steps.omar.outputs.run_id }}
          path: .sentinelayer/runs/${{ steps.omar.outputs.run_id }}
          if-no-files-found: warn

  challenge-static-nightly:
    name: Challenge Static Validation (Nightly/Manual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python
        run: python -m compileall records scripts .github/actions/sentinelayer-v1-action/src

      - name: Check submission structure
        run: python scripts/check_submission.py --root .

      - name: Check forbidden patterns
        run: python scripts/check_no_forbidden_calls.py --path records

      - name: Check artifact budgets when files exist
        run: |
          python scripts/check_artifact.py --candidate-root records --budget-bytes 16000000 --allow-missing-model

      - name: Check assignment limits when reported
        run: |
          python scripts/check_assignment_limits.py --candidate-root records --allow-missing

      - name: Optional score regression guard
        run: |
          python scripts/score_guard.py \
            --history results/history.csv \
            --candidate-json results/latest_candidate.json \
            --allow-missing

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parameter-golf-static-nightly
          path: |
            results
            records
          if-no-files-found: warn

  gpu-placeholder:
    name: GPU Validation Placeholder
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Replace this job with a self-hosted Runpod / H100 runner."
          echo "Use it for real training/eval, then write evidence into results/."
